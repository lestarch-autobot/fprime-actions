name: 'Setup F´'
description: 'Setup the F´ repository and tools'
inputs:
  location:
    required: true
    default: $GITHUB_WORKSPACE
    description: "Path to the root of the F´ repository"
  ccache:
    required: false
    default: "true"
    description: "Enable ccache backed by the GitHub Actions cache"
  ccache-key-suffix:
    required: false
    default: ""
    description: "Extra ccache key discriminator (e.g. a matrix value)"
runs:
  using: "composite"
  steps:
  # macOS GitHub-hosted runners ship Homebrew Python which is marked as
  # "externally managed" (PEP 668). This prevents pip install from working
  # without a virtual environment. actions/setup-python creates a usable,
  # non-Homebrew Python so subsequent pip installs succeed.
  - name: "Setup Python (macOS)"
    if: runner.os == 'macOS'
    uses: actions/setup-python@v5
    with:
      python-version: "3.x"
  # --no-recurse-submodules: with git's default on-demand recursion this fetch would also fetch the submodule pins
  # of every newly fetched branch and fail on any pin that no longer exists upstream (e.g. a force-pushed fork).
  - run: git fetch --tags --no-recurse-submodules
    shell: bash
  # Cache pip downloads/wheels so requirement installs avoid re-downloading.
  # Rooted in RUNNER_TEMP so the workspace-relative archive restores on every runner layout.
  - name: "Configure pip cache directory"
    run: echo "PIP_CACHE_DIR=${RUNNER_TEMP}/pip-cache" >> "${GITHUB_ENV}"
    shell: bash
  - name: "Cache pip downloads"
    uses: actions/cache@v4
    with:
      path: ${{ runner.temp }}/pip-cache
      key: pip-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/requirements.txt') }}
      restore-keys: |
        pip-${{ runner.os }}-${{ runner.arch }}-
  - name: "Enable ccache"
    if: inputs.ccache == 'true'
    uses: nasa/fprime-actions/ccache@devel
    with:
      key-suffix: ${{ inputs.ccache-key-suffix }}
  - run: pip3 install setuptools_scm wheel urllib3
    shell: bash
  - name: "Install F´ requirements"
    shell: bash
    env:
      FPRIME_LOCATION: ${{ inputs.location }}
    run: pip3 install -U -r ${FPRIME_LOCATION}/requirements.txt
  # Runner images pre-set JAVA_HOME to a system JDK. Clear it so Java-based
  # tools (fpp) resolve the pip-installed `java` (fprime-jre) from PATH.
  - name: "Clear JAVA_HOME"
    shell: bash
    run: echo "JAVA_HOME=" >> "${GITHUB_ENV}"
  - run: which fprime-util
    shell: bash
  - run: which fprime-gds
    shell: bash
  - run: which fpp-check
    shell: bash
