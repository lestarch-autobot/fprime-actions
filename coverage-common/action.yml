name: "F´ Coverage (common)"
description: >
  Shared coverage generation used by coverage-check (PR-only) and
  coverage-update (push-only).  Discovers F´ modules, runs gcovr globally
  and per-module, and renames each module's coverage.html to index.html.
  Assumes the caller has already run generate + build (e.g. via the
  run-unit-tests action with run-check: 'false').
inputs:
  working-directory:
    description: "Directory to run fprime-util from"
    required: false
    default: "."
  target-platform:
    description: "Target platform/toolchain passed to fprime-util (e.g. native)"
    required: false
    default: ""
  jobs:
    description: "Parallel job count: a number, 'random' (1-32), or empty to omit -j"
    required: false
    default: ""
  strict:
    description: >
      When 'true', fail the action if any module's UT/coverage build fails.
      Default 'false' so individual module failures surface as missing
      summary.json (rendered as "no coverage" in the PR comment / catalog)
      without failing the whole CI job.
    required: false
    default: "false"
  debug:
    description: >
      When 'true', forward gcovr's verbose output (-v) for the global and
      per-module steps.  Useful for diagnosing slow or stuck coverage runs.
    required: false
    default: "false"
outputs:
  modules-jsonl:
    description: "Path to the JSON-Lines file listing discovered modules"
    value: ${{ steps.discover.outputs.modules-jsonl }}

runs:
  using: "composite"
  steps:
    - name: "Install gcc-12 for coverage build"
      shell: bash
      run: |
        # Ubuntu 22.04 ships gcc-11 / gcov-11 by default.  gcov-11 has
        # known regressions on heavily-templated test code (gcc#68080
        # counter overflow + pathological symbol-table walks that can
        # turn a 30 s coverage run into a 30 min one).  gcc-12 fixes both.
        # Installing here only affects the coverage job; other jobs still
        # use the runner's default compiler.
        if ! command -v gcc-12 >/dev/null 2>&1; then
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-12 g++-12
        fi
        # Point the default gcc / g++ / gcov symlinks at the v12 toolchain
        # so CMake, fprime-util, and gcovr all pick it up without per-tool
        # plumbing.
        sudo update-alternatives \
          --install /usr/bin/gcc  gcc  /usr/bin/gcc-12  120 \
          --slave   /usr/bin/g++  g++  /usr/bin/g++-12        \
          --slave   /usr/bin/gcov gcov /usr/bin/gcov-12
        echo "gcc:  $(gcc  --version | head -1)"
        echo "g++:  $(g++  --version | head -1)"
        echo "gcov: $(gcov --version | head -1)"

    - name: "Reset build cache for gcc-12 coverage build"
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        # The caller's run-unit-tests step (if any) configured the build
        # cache with whatever compiler was default at that time.  Wipe it
        # so fprime-util check --all --coverage below reconfigures cleanly
        # with the v12 toolchain.
        rm -rf build-fprime-automatic-*-ut* || true

    - name: "Discover modules"
      id: discover
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        python3 "${ACTION_PATH}/scripts/discover.py" --root . > modules.jsonl
        echo "modules-jsonl=$(pwd)/modules.jsonl" >> "$GITHUB_OUTPUT"
        echo "Discovered $(wc -l < modules.jsonl) modules"

    - name: "Global coverage (fprime-util check --all --coverage)"
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      env:
        JOBS_INPUT: ${{ inputs.jobs }}
        TARGET_PLATFORM: ${{ inputs.target-platform }}
        DEBUG: ${{ inputs.debug }}
      run: |
        JOBS_FLAG=""
        if [ "${JOBS_INPUT}" = "random" ]; then
          JOBS=$(( (RANDOM % 32) + 1 ))
          JOBS_FLAG="-j${JOBS}"
        elif [ -n "${JOBS_INPUT}" ]; then
          JOBS_FLAG="-j${JOBS_INPUT}"
        fi
        VERBOSE_FLAG=""
        if [ "${DEBUG}" = "true" ]; then
          VERBOSE_FLAG="-v"
        fi
        # --gcov-ignore-parse-errors handles the known gcov-11 counter
        # overflow (gcc#68080) defensively.  With gcc-12 it should never
        # fire, but cheap insurance against future toolchain regressions.
        fprime-util check --all --coverage ${JOBS_FLAG} ${TARGET_PLATFORM} \
          --pass-through --json-summary coverage/summary.json \
          --gcov-ignore-parse-errors=negative_hits.warn_once_per_file \
          ${VERBOSE_FLAG}

    - name: "Per-module coverage"
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        TARGET_PLATFORM: ${{ inputs.target-platform }}
        MODULES_JSONL: ${{ steps.discover.outputs.modules-jsonl }}
        STRICT: ${{ inputs.strict }}
        DEBUG: ${{ inputs.debug }}
      run: |
        STRICT_FLAG=""
        if [ "${STRICT}" = "true" ]; then
          STRICT_FLAG="--strict"
        fi
        DEBUG_FLAG=""
        if [ "${DEBUG}" = "true" ]; then
          DEBUG_FLAG="--debug"
        fi
        python3 "${ACTION_PATH}/scripts/run_coverage.py" \
          --root . \
          --modules-jsonl "$MODULES_JSONL" \
          --target-platform "${TARGET_PLATFORM}" \
          ${STRICT_FLAG} \
          ${DEBUG_FLAG}
